<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>アンケート集計（スタッフ用）</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root{--navy:#12355b;--orange:#f07c22;--sea:#2fa8dc;--line:#dbe6ee;--muted:#5b6b7c}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,"Noto Sans JP",sans-serif;background:#f4f8fb;color:#1d2a38;line-height:1.6}
  header{background:var(--navy);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px}
  header img{height:28px;width:auto}
  header h1{font-size:1rem;margin:0}
  main{max-width:1000px;margin:0 auto;padding:16px}
  .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:#fff;padding:12px;border-radius:12px;border:1px solid var(--line)}
  input,select,button{font:inherit;padding:7px 10px;border-radius:8px;border:1px solid #c6d4de}
  button{background:var(--navy);color:#fff;border-color:var(--navy);cursor:pointer}
  button.sub{background:#fff;color:var(--navy)}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
  .kpi b{display:block;font-size:1.7rem;color:var(--navy)}
  .kpi span{color:var(--muted);font-size:.85rem}
  .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px}
  .box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
  .box h2{font-size:.95rem;margin:0 0 8px;color:var(--navy)}
  .hb{display:grid;grid-template-columns:7em 1fr 2.5em;gap:8px;align-items:center;font-size:.88rem;margin:4px 0}
  .hb i{display:block;height:12px;border-radius:6px;background:var(--sea)}
  .hb em{font-style:normal;text-align:right;color:var(--muted)}
  table{width:100%;border-collapse:collapse;background:#fff;font-size:.85rem}
  th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
  th{background:#eef4f8;position:sticky;top:0}
  .scroll{max-height:60vh;overflow:auto;border:1px solid var(--line);border-radius:12px;margin-top:10px}
  #msg{color:#b42318;font-weight:600}
</style>
</head>
<body>
<header><img src="/img/logo-white.svg" alt=""><h1>アンケート集計（スタッフ用）</h1></header>
<main>
  <div class="bar">
    <label>管理トークン <input type="password" id="tok" autocomplete="current-password" size="18"></label>
    <label>回 <select id="ev"><option value="">すべて</option></select></label>
    <button id="load">読み込む</button>
    <button id="csv" class="sub">CSVダウンロード</button>
    <span id="msg"></span>
  </div>

  <div id="out" hidden>
    <div class="kpis">
      <div class="kpi"><b id="kN">0</b><span>回答数</span></div>
      <div class="kpi"><b id="kFun">-</b><span>たのしさ平均（5点満点）</span></div>
      <div class="kpi"><b id="kUnd">-</b><span>しくみ「よくわかった」</span></div>
      <div class="kpi"><b id="kAgain">-</b><span>また来たい</span></div>
      <div class="kpi"><b id="kDist">-</b><span>最長きょり（cm）</span></div>
    </div>
    <div class="cols">
      <div class="box"><h2>学年</h2><div id="hGrade"></div></div>
      <div class="box"><h2>たのしさ</h2><div id="hFun"></div></div>
      <div class="box"><h2>組み立ての難しさ</h2><div id="hDiff"></div></div>
      <div class="box"><h2>おもしろかったこと</h2><div id="hLiked"></div></div>
    </div>
    <div class="scroll">
      <table><thead><tr><th>日時</th><th>回</th><th>学年</th><th>楽</th><th>難</th><th>きょり</th><th>つぎに作りたい</th><th>感想</th></tr></thead><tbody id="rows"></tbody></table>
    </div>
  </div>
</main>
<script>
(() => {
  const $ = s => document.querySelector(s);
  const L = { easy:"かんたん", just:"ちょうどいい", hard:"むずかしい", story:"お話", build:"組み立て", swim:"泳がせる", race:"競争", yes:"来たい", maybe:"たぶん", no:"いいえ" };
  try { $("#tok").value = sessionStorage.getItem("ugtok") || ""; } catch {}
  const headers = () => ({ Authorization: "Bearer " + $("#tok").value.trim() });
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
  const hist = (el, counts, order) => {
    const max = Math.max(1, ...Object.values(counts));
    el.innerHTML = (order || Object.keys(counts)).map(k =>
      `<div class="hb"><span>${esc(L[k] || k)}</span><i style="width:${(counts[k]||0)/max*100}%"></i><em>${counts[k]||0}</em></div>`).join("");
  };
  async function load() {
    $("#msg").textContent = "";
    try { sessionStorage.setItem("ugtok", $("#tok").value.trim()); } catch {}
    const ev = $("#ev").value;
    const r = await fetch("/api/results" + (ev ? "?event=" + encodeURIComponent(ev) : ""), { headers: headers() });
    if (!r.ok) { $("#msg").textContent = r.status === 401 ? "トークンがちがいます" : "読み込みエラー " + r.status; return; }
    const { rows, events } = await r.json();
    const sel = $("#ev"), cur = sel.value;
    sel.innerHTML = '<option value="">すべて</option>' + events.map(e => `<option value="${esc(e.event)}">${esc(e.event || "(指定なし)")}（${e.n}）</option>`).join("");
    sel.value = cur;
    const n = rows.length, cnt = (k, f = r => r[k]) => rows.reduce((m, r) => { const v = f(r); if (v != null && v !== "") m[v] = (m[v]||0)+1; return m; }, {});
    $("#kN").textContent = n;
    $("#kFun").textContent = n ? (rows.reduce((s, r) => s + r.fun, 0) / n).toFixed(2) : "-";
    const und = rows.filter(r => r.understand != null);
    $("#kUnd").textContent = und.length ? Math.round(und.filter(r => r.understand === 3).length / und.length * 100) + "%" : "-";
    const ag = rows.filter(r => r.again);
    $("#kAgain").textContent = ag.length ? Math.round(ag.filter(r => r.again === "yes").length / ag.length * 100) + "%" : "-";
    const ds = rows.map(r => r.distance).filter(v => v != null);
    $("#kDist").textContent = ds.length ? Math.max(...ds) : "-";
    hist($("#hGrade"), cnt("grade"), ["小1-2","小3-4","小5-6","中学生","保護者","その他"]);
    hist($("#hFun"), cnt("fun"), ["5","4","3","2","1"]);
    hist($("#hDiff"), cnt("difficulty"), ["easy","just","hard"]);
    const liked = {}; rows.forEach(r => (r.liked || "").split(",").filter(Boolean).forEach(k => liked[k] = (liked[k]||0)+1));
    hist($("#hLiked"), liked, ["story","build","swim","race"]);
    $("#rows").innerHTML = rows.map(r => `<tr><td>${esc(r.created_at)}</td><td>${esc(r.event)}</td><td>${esc(r.grade)}</td><td>${r.fun}</td><td>${esc(L[r.difficulty]||"")}</td><td>${r.distance ?? ""}</td><td>${esc(r.next_idea)}</td><td>${esc(r.comment)}</td></tr>`).join("");
    $("#out").hidden = false;
  }
  $("#load").onclick = load;
  $("#ev").onchange = load;
  $("#csv").onclick = async () => {
    const ev = $("#ev").value;
    const r = await fetch("/api/results?format=csv" + (ev ? "&event=" + encodeURIComponent(ev) : ""), { headers: headers() });
    if (!r.ok) { $("#msg").textContent = "CSVを取得できませんでした"; return; }
    const url = URL.createObjectURL(await r.blob());
    const a = Object.assign(document.createElement("a"), { href: url, download: `survey${ev ? "-" + ev : ""}.csv` });
    a.click(); setTimeout(() => URL.revokeObjectURL(url), 2000);
  };
})();
</script>
</body>
</html>
